<script>
  // Normalized Area Units & Math Engine
  const AREA_CONVERTER = {
    toSquareMeters(value, unit) {
      const val = parseFloat(value) || 0;
      switch (unit) {
        case 'shotok':
        case 'decimal': return val * 40.4686;
        case 'katha': return val * 1.65 * 40.4686;
        case 'bigha': return val * 33 * 40.4686;
        case 'acre': return val * 100 * 40.4686;
        case 'hectare': return val * 10000;
        default: return val;
      }
    },
    fromSquareMeters(sqm, targetUnit) {
      const s = parseFloat(sqm) || 0;
      switch (targetUnit) {
        case 'shotok':
        case 'decimal': return s / 40.4686;
        case 'katha': return s / (1.65 * 40.4686);
        case 'bigha': return s / (33 * 40.4686);
        case 'acre': return s / (100 * 40.4686);
        case 'hectare': return s / 10000;
        default: return s;
      }
    },
    toBanglaNum(numStr) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(numStr).replace(/[0-9]/g, (d) => bnDigits[d]);
    }
  };

  // Toast Notification
  window.showToast = function(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    const colors = type === 'success' ? 'bg-success-leaf text-white' : type === 'info' ? 'bg-hz-navy text-white' : 'bg-primary text-white';
    toast.className = `${colors} px-4 py-3 rounded-hz shadow-hz-lg text-xs font-bold flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto border border-white/20`;
    toast.innerHTML = `<span class="material-symbols-outlined text-base">${type === 'success' ? 'check_circle' : 'info'}</span><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove('translate-y-[-10px]', 'opacity-0'); }, 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-[-10px]');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  };

      if (d[key]) el.textContent = d[key];

  // Router
  function handleRoute() {
    const hash = window.location.hash.slice(1) || 'home';
    const parts = hash.split('/');
    const mainRoute = parts[0];
    const param = parts[1];

    window.PlotShareApp.currentRoute = mainRoute;
    if (mainRoute === 'plot-details' && param) {
      window.PlotShareApp.selectedPlot = window.PlotShareApp.plots.find(p => p.id === param) || window.PlotShareApp.plots[0];
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
      const target = tab.getAttribute('data-target');
      if (target === mainRoute) {
        tab.classList.add('nav-tab-active');
      } else {
        tab.classList.remove('nav-tab-active');
      }
    });

    renderCurrentRoute();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', handleRoute);

  // Signature Pad
  function initSignaturePad() {
    const canvas = document.getElementById('signature-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#A43700';

    let drawing = false;

    function startDraw(e) {
      drawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      ctx.lineTo(clientX - rect.left, clientY - rect.top);
      ctx.stroke();
    }

    function stopDraw() { drawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    window.clearSignaturePad = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }

  window.scanSampleDisease = function(diseaseId) {
    const d = window.PlotShareApp.diseases.find(x => x.id === diseaseId);
    if (!d) return;

    const isBn = window.PlotShareApp.lang === 'bn';
    const radar = document.getElementById('scanner-radar');
    const idle = document.getElementById('scanner-idle-state');
    const img = document.getElementById('scanner-preview-img');
    const resultBox = document.getElementById('disease-result-box');

    if (radar) radar.classList.remove('hidden');
    if (idle) idle.classList.add('hidden');
    if (img) {
      img.classList.remove('hidden');
      img.src = 'https://lh3.googleusercontent.com/aida-public/AB6AXuAMsBPFIE6sgdlb09X4ttUptcHKOhTZTTFPJWpqPChq5BbJ1LRB-GZISGWUB42jKVdb-F3V_w77Wxgon0UyDKFw5Vz054rNz6nPnyx7hF_TyF9KJPcdzGhJ0PfCKh1DaIXcos7PtOrO67QHPb20x_kFgcgdAuApa1-X9DazYvdb5tRnmIzsDp-jd1jXeGm2IjRbatU2oYninWH7IL3nq8VAdyoGMig7QRbmcDi7NX1gMOeSirsn5YgPHg';
    }

    showToast(isBn ? 'এআই দ্বারা পাতা স্ক্যান করা হচ্ছে...' : 'AI scanning leaf...', 'info');

    setTimeout(() => {
      if (radar) radar.classList.add('hidden');
      if (resultBox) {
        resultBox.classList.remove('hidden');
        document.getElementById('res-severity').textContent = d.severity;
        document.getElementById('res-disease-name').textContent = isBn ? d.name_bn : d.name_en;
        document.getElementById('res-symptoms').textContent = isBn ? d.symptoms_bn : d.symptoms_en;
        document.getElementById('res-organic').textContent = isBn ? d.organic_remedy_bn : d.organic_remedy_en;
        document.getElementById('res-chemical').textContent = isBn ? d.chemical_remedy_bn : d.chemical_remedy_en;
      }
      showToast(isBn ? 'রোগ সনাক্তকরণ সম্পন্ন ও প্রেসক্রিপশন প্রস্তুত!' : 'Diagnosis complete!', 'success');
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }, 900);
  };

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-extrabold text-hz-navy mb-1">🌾 ${isBn ? 'ফসল' : 'Crop'}</label>
              <select class="w-full bg-hz-input h-11 px-3 rounded-hz border border-hz-border text-xs font-extrabold text-primary">
                <option>${isBn ? 'বোরো ধান (Boro Rice)' : 'Boro Rice'}</option>
                <option>${isBn ? 'আলু (Potato)' : 'Potato'}</option>
                <option>${isBn ? 'সরিষা (Mustard)' : 'Mustard'}</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-extrabold text-hz-navy mb-1">📐 ${isBn ? 'জমির পরিমাণ (শতক)' : 'Area (Shotok)'}</label>
              <input type="number" value="50" class="w-full bg-hz-input h-11 px-3 rounded-hz border border-hz-border text-xs font-extrabold text-hz-navy" required>
            </div>
          </div>
          <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-hz font-extrabold text-xs shadow-primary-btn hover:bg-primary-hover transition-all">
            ${isBn ? 'পরিকল্পনা তৈরি করুন' : 'Generate Farm Plan'}
          </button>
        </form>
      </div>
    `;
  }

  // 11. CROP PLANNER
  function renderCropPlannerScreen(isBn) {
    return `
      <div class="px-4 py-4 flex flex-col gap-4 pb-20">
        <h2 class="text-base font-extrabold text-hz-navy">${isBn ? 'বাংলাদেশ কৃষি ক্যালেন্ডার' : 'Agricultural Calendar'}</h2>
        <div class="flex flex-col gap-3">
          ${SEASONS.map(s => `
            <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz flex flex-col gap-2">
              <div class="flex items-center justify-between">
                <h3 class="font-extrabold text-sm text-primary">${isBn ? s.name_bn : s.name_en}</h3>
                <span class="text-[11px] bg-secondary-light text-secondary-dark px-2.5 py-0.5 rounded-hz-pill font-extrabold border border-secondary/30">${isBn ? s.period_bn : s.period_en}</span>
              </div>
              <p class="text-xs text-hz-slate-dark font-medium">${isBn ? 'প্রধান ফসল:' : 'Key Crops:'} ${s.typical_crops.join(', ')}</p>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // 12. HARVEST TRACKER
  function renderHarvestTrackerScreen(isBn) {
    return `
      <div class="px-4 py-4 flex flex-col gap-4 pb-20">
        <h2 class="text-base font-extrabold text-hz-navy">${isBn ? 'ফলন ও বিক্রি ট্র্যাকার' : 'Harvest Tracker'}</h2>
        <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz">
          <h4 class="font-extrabold text-xs text-hz-navy">রোপা আমন ধান (ব্রি-৪৯)</h4>
          <p class="text-[11px] text-success-leaf font-extrabold mt-0.5">ফলন: ৩৮ মণ (১৫২০ কেজি) • বিক্রয়: ৳৪১,৮০০</p>
        </div>
      </div>
    `;
  }

  // 13. COMMUNITY & MARKETPLACE
  function renderCommunityScreen(isBn) {
    return `
      <div class="px-4 py-4 flex flex-col gap-4 pb-20">
        <h2 class="text-base font-extrabold text-hz-navy">${isBn ? 'কৃষক কমিউনিটি ও নেটওয়ার্ক' : 'Farmer Community Network'}</h2>
        <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz">
          <h4 class="font-extrabold text-xs text-hz-navy">মো: শফিকুল ইসলাম (দিনাজপুর)</h4>
          <p class="text-xs text-hz-slate-dark mt-1">আলহামদুলিল্লাহ, বীরগঞ্জে এ বছর ব্রি-২৮ এর চারা বেশ সুস্থ। মাজরা পোকা প্রতিরোধে নিম তেল ব্যবহারের পরামর্শ দিচ্ছি।</p>
        </div>
      </div>
    `;
  }

  function renderMarketplaceScreen(isBn) {
    return `
      <div class="px-4 py-4 flex flex-col gap-4 pb-20">
        <h2 class="text-base font-extrabold text-hz-navy">${isBn ? 'ফসল বাজার ও বেচাকেনা' : 'Produce Marketplace'}</h2>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz">
            <h4 class="font-extrabold text-xs text-hz-navy">৫০ মণ আমন ধান (ব্রি-৪৯)</h4>
            <p class="text-xs font-extrabold text-primary mt-1">৳১,১৫০ / মণ</p>
          </div>
          <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz">
            <h4 class="font-extrabold text-xs text-hz-navy">৮০ মণ ডায়মন্ড আলু</h4>
            <p class="text-xs font-extrabold text-primary mt-1">৳৯৫০ / মণ</p>
          </div>
        </div>
      </div>
    `;
  }

  // 14. NOTIFICATIONS & PROFILE
  function renderNotificationsScreen(isBn) {
    return `
      <div class="px-4 py-4 flex flex-col gap-3 pb-20">
        <h2 class="text-base font-extrabold text-hz-navy">${isBn ? 'নোটিফিকেশন ও বার্তা' : 'Notifications'}</h2>
        <div class="bg-hz-card p-4 rounded-hz-lg border border-hz-border shadow-hz">
          <h4 class="font-extrabold text-xs text-hz-navy">${isBn ? 'আবহাওয়া সতর্কতা' : 'Weather Alert'}</h4>
          <p class="text-xs text-hz-slate-dark mt-0.5">${isBn ? 'আগামীকাল দিনাজপুরে বৃষ্টির সম্ভাবনা। সেচ স্থগিত রাখুন।' : 'Rain forecasted tomorrow. Hold irrigation.'}</p>
        </div>
      </div>
    `;
  }

  function renderProfileScreen(isBn) {
    const farm = window.PlotShareApp.farmData;
    return `
      <div class="px-4 py-4 flex flex-col gap-4 pb-20">
        <div class="bg-hz-card p-5 rounded-hz-lg border border-hz-border shadow-hz flex items-center gap-4">
          <div class="w-14 h-14 rounded-full bg-primary-light text-primary flex items-center justify-center font-extrabold text-2xl">🌾</div>
          <div>
            <h3 class="font-extrabold text-base text-hz-navy">${isBn ? farm.farmer_name_bn : farm.farmer_name_en}</h3>
            <p class="text-xs text-hz-slate font-medium">${isBn ? farm.farmer_type_bn : farm.farmer_type_en}</p>
            <p class="text-[11px] text-primary font-bold mt-0.5">কৃষি কার্ড নং: ${farm.krishi_card_no}</p>
          </div>
        </div>
      </div>
    `;
  }

  // ACTIONS
  window.toggleFav = function(plotId) {
    const favs = window.PlotShareApp.savedFavorites;
    const idx = favs.indexOf(plotId);
    if (idx > -1) {
      favs.splice(idx, 1);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দ থেকে সরানো হয়েছে' : 'Removed from favorites', 'info');
    } else {
      favs.push(plotId);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দের তালিকায় যুক্ত' : 'Added to favorites', 'success');
    }
    localStorage.setItem('plotshare_favs', JSON.stringify(favs));
    renderCurrentRoute();
  };

  window.executeSearch = function() {
    window.location.hash = '#explore';
    showToast(window.PlotShareApp.lang === 'bn' ? 'জমি ফিল্টার করা হয়েছে' : 'Filtered lands', 'info');
  };

  window.quickFilterDistrict = function(dist) {
    window.location.hash = '#explore';
    showToast(window.PlotShareApp.lang === 'bn' ? 'জেলা অনুযায়ী জমি প্রদর্শিত হচ্ছে' : 'Displaying lands for district', 'info');
  };

  window.submitAgreementRequest = function() {
    showToast(window.PlotShareApp.lang === 'bn' ? 'স্বাক্ষরিত বর্গা চুক্তিপত্র সফলভাবে পাঠানো হয়েছে!' : 'Signed agreement proposal submitted!', 'success');
    setTimeout(() => { window.location.hash = '#my-farm'; }, 1000);
  };

  window.handlePlotPublish = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'আপনার কৃষি জমি সফলভাবে তালিকাভুক্ত হয়েছে!' : 'Farmland published successfully!', 'success');
    setTimeout(() => { window.location.hash = '#explore'; }, 1000);
  };

  window.openAddExpenseModal = function(cropId) {
    showToast(window.PlotShareApp.lang === 'bn' ? 'খরচ ভাউচার সংরক্ষিত হয়েছে' : 'Expense voucher logged', 'success');
  };

  window.askAIQuery = function(q) {
    const input = document.getElementById('ai-user-input');
    if (input) input.value = q;
    handleAIChatSubmit(new Event('submit'));
  };

  window.handleAIChatSubmit = function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const input = document.getElementById('ai-user-input');
    if (!input || !input.value.trim()) return;

    const userText = input.value.trim();
    input.value = '';

    window.PlotShareApp.chatMessages.push({ sender: 'user', text: userText });
    renderCurrentRoute();

    setTimeout(() => {
      let respBn = 'আপনার প্রশ্নের জন্য ধন্যবাদ। মাটির আর্দ্রতা পরীক্ষা করে প্রতি শতকে ১.২ কেজি ইউরিয়া ও ০.৬ কেজি টিএসপি সার প্রয়োগের পরামর্শ দেওয়া হচ্ছে।';
      let respEn = 'Thank you for your question. Based on current soil conditions, recommend applying 1.2 kg Urea and 0.6 kg TSP per shotok.';
      window.PlotShareApp.chatMessages.push({ sender: 'ai', text_bn: respBn, text_en: respEn });
      renderCurrentRoute();
    }, 500);
  };

  window.generateFarmPlan = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'খামার পরিকল্পনা প্রস্তুত!' : 'Farm plan generated!', 'success');
  };

  function attachScreenEventHandlers() {
    const box = document.getElementById('ai-chat-box');
    if (box) box.scrollTop = box.scrollHeight;
  }

  // BULLETPROOF IMMEDIATE INITIALIZATION
  function startPlotShareApp() {
    try {
      updateGlobalUI();
      handleRoute();
    } catch (err) {
      console.error('PlotShare init error:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startPlotShareApp);
  } else {
    startPlotShareApp();
  }
</script>
</body>
</html>
