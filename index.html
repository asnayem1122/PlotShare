<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlotShare — Bangladesh Agricultural Land & Farming Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Leaflet.js Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // Horizon UI Base Structure
            "hz-bg": "#F4F7FE",
            "hz-card": "#FFFFFF",
            "hz-border": "#E0E5F2",
            "hz-navy": "#2B3674",
            "hz-navy-dark": "#1B254B",
            "hz-slate": "#A3AED0",
            "hz-slate-dark": "#707EAE",
            "hz-input": "#F4F7FE",
            
            // Original Harvest Accents
            "primary": "#A43700",
            "primary-hover": "#8A2E00",
            "primary-light": "#FFF3EC",
            "primary-glow": "rgba(164, 55, 0, 0.25)",
            "secondary": "#FEB300",
            "secondary-dark": "#7E5700",
            "secondary-light": "#FFF9E6",
            "success-leaf": "#2D5A27",
            "success-mint": "#05CD99",
            "success-light": "#E6F8F3",
            "terracotta": "#914723",
            "terracotta-light": "#FBEFEA"
          },
          fontFamily: {
            sans: ["'Plus Jakarta Sans'", "'Hind Siliguri'", "sans-serif"]
          },
          borderRadius: {
            "hz": "20px",
            "hz-lg": "24px",
            "hz-xl": "30px",
            "hz-pill": "9999px"
          },
          boxShadow: {
            "hz": "0px 18px 40px rgba(112, 144, 176, 0.12)",
            "hz-sm": "0px 6px 20px rgba(112, 144, 176, 0.08)",
            "hz-lg": "14px 17px 40px 4px rgba(112, 144, 176, 0.15)",
            "hz-inner": "inset 0px 2px 6px rgba(112, 144, 176, 0.08)",
            "primary-btn": "0px 10px 20px rgba(164, 55, 0, 0.25)"
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F4F7FE;
      color: #2B3674;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Device Frame Toggle */
    .device-preview-wrapper {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 50px rgba(112, 144, 176, 0.18);
      position: relative;
      background: #F4F7FE;
    }
    .fullscreen-mode .device-preview-wrapper {
      max-width: 100%;
      box-shadow: none;
    }
    
    .nav-tab-active {
      color: #A43700 !important;
      font-weight: 700;
    }
    .nav-tab-active .tab-indicator {
      display: block !important;
    }
    
    .page-fade-in {
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Horizon UI Custom Map Pin */
    .custom-map-pin {
      background: #A43700;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 9999px;
      box-shadow: 0px 8px 16px rgba(164, 55, 0, 0.35);
      border: 2px solid #FFFFFF;
      white-space: nowrap;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Scanner radar animation */
    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #05CD99, transparent);
      box-shadow: 0 0 15px #05CD99;
      animation: scanRadar 2s infinite ease-in-out;
    }
    @keyframes scanRadar {
      0% { top: 0; opacity: 0.8; }
      50% { top: 100%; opacity: 1; }
      100% { top: 0; opacity: 0.8; }
    }
  </style>
</head>
<body class="bg-hz-bg text-hz-navy antialiased select-none">

<div class="device-preview-wrapper flex flex-col relative min-h-screen" id="app-root">

  <!-- TOP HORIZON UI FLOATING HEADER (Glassmorphism & Breadcrumbs) -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-hz-border/60 pt-safe px-4 py-3 flex items-center justify-between shadow-hz-sm" id="global-header">
    <div class="flex items-center gap-3">
      <a href="#home" class="flex items-center gap-2.5" id="header-brand-link">
        <div class="w-10 h-10 rounded-hz bg-primary-light flex items-center justify-center text-primary shadow-sm font-extrabold text-xl">🌾</div>
        <div>
          <h1 class="font-extrabold text-base leading-tight text-hz-navy flex items-center gap-1.5">
            <span id="brand-title">প্লটশেয়ার</span>
            <span class="text-[10px] bg-secondary text-hz-navy px-2 py-0.5 rounded-full font-extrabold uppercase tracking-wider">BD</span>
          </h1>
          <p class="text-[11px] text-hz-slate font-medium leading-none" id="brand-subtitle">কৃষি জমি ও চাষাবাদ প্ল্যাটফর্ম</p>
        </div>
      </a>
    </div>

    <!-- Right Horizon Controls: Language Switcher + Devices + Notifications -->
    <div class="flex items-center gap-2">
      <!-- Language Switcher Pill -->
      <button id="btn-lang-toggle" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-hz-pill bg-hz-input text-primary font-bold text-xs border border-hz-border flex items-center gap-1.5 hover:bg-primary hover:text-white transition-all shadow-sm">
        <span class="material-symbols-outlined text-[15px]">language</span>
        <span id="lang-btn-label">English</span>
      </button>

      <!-- View Mode (Mobile Frame vs Fullscreen) -->
      <button onclick="toggleDeviceView()" class="w-9 h-9 rounded-hz bg-hz-input border border-hz-border flex items-center justify-center text-hz-slate hover:text-primary transition-colors shadow-sm" title="Toggle Layout View">
        <span class="material-symbols-outlined text-[18px]">devices</span>
      </button>

      <!-- Notifications Bell -->
      <a href="#notifications" class="w-9 h-9 rounded-hz bg-hz-input border border-hz-border flex items-center justify-center text-hz-slate hover:text-primary relative transition-colors shadow-sm">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary ring-2 ring-white"></span>
      </a>
    </div>
  </header>

  <!-- SCREEN VIEWPORT CONTAINER -->
  <main class="flex-1 w-full pb-24 overflow-x-hidden relative" id="screen-container">
    <!-- Dynamically rendered screen content -->
  </main>

  <!-- HORIZON UI FLOATING BOTTOM DOCK NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-xl border-t border-hz-border pb-safe shadow-[0_-4px_25px_rgba(112,144,176,0.1)]" id="global-bottom-nav">
    <div class="max-w-[440px] mx-auto flex items-center justify-around h-16 px-2 relative" id="bottom-nav-inner">
      
      <!-- 1. Home -->
      <a href="#home" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-hz-slate transition-all" data-target="home">
        <span class="material-symbols-outlined text-2xl">grid_view</span>
        <span class="text-[11px] font-semibold mt-0.5" data-i18n="home">হোম</span>
        <span class="tab-indicator hidden w-5 h-1 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- 2. Explore Farmlands -->
      <a href="#explore" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-hz-slate transition-all" data-target="explore">
        <span class="material-symbols-outlined text-2xl">explore</span>
        <span class="text-[11px] font-semibold mt-0.5" data-i18n="explore">জমি খুঁজুন</span>
        <span class="tab-indicator hidden w-5 h-1 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- Center Horizon Primary Action (+ List Land) -->
      <div class="flex flex-col items-center justify-center -translate-y-4">
        <a href="#list-plot" class="w-13 h-13 p-3 rounded-hz-lg bg-primary text-white flex items-center justify-center shadow-primary-btn hover:scale-105 active:scale-95 transition-transform" title="List Farmland">
          <span class="material-symbols-outlined text-2xl font-bold">add_location_alt</span>
        </a>
        <span class="text-[10px] font-extrabold text-primary mt-1" data-i18n="list_plot">জমি দিন</span>
      </div>

      <!-- 3. My Farm -->
      <a href="#my-farm" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-hz-slate transition-all" data-target="my-farm">
        <span class="material-symbols-outlined text-2xl">bar_chart</span>
        <span class="text-[11px] font-semibold mt-0.5" data-i18n="my_farm">আমার খামার</span>
        <span class="tab-indicator hidden w-5 h-1 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- 4. AI Assistant -->
      <a href="#grow-assistant" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-hz-slate transition-all" data-target="grow-assistant">
        <span class="material-symbols-outlined text-2xl">psychology</span>
        <span class="text-[11px] font-semibold mt-0.5" data-i18n="ai_assistant">কৃষি সহায়ক</span>
        <span class="tab-indicator hidden w-5 h-1 bg-primary rounded-full mt-0.5"></span>
      </a>

    </div>
  </nav>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-[90%] max-w-[380px]"></div>

  <!-- MODAL PORTAL CONTAINER (HORIZON UI DIALOGS) -->
  <div id="modal-container" class="fixed inset-0 z-50 bg-hz-navy-dark/60 backdrop-blur-sm hidden flex items-center justify-center p-4"></div>

</div>

<!-- APPLICATION CORE SCRIPTS -->
<script type="module">
  import { 
    BANGLADESH_LOCATIONS, 
    AREA_CONVERTER, 
    SEASONS, 
    CROPS, 
    PLANT_DISEASES, 
    INITIAL_PLOTS, 
    AGRICULTURAL_MACHINERY, 
    WHOLESALE_MARKET_RATES, 
    CURRENT_FARM_DATA, 
    DICTIONARY 
  } from './src/data/bangladeshData.js';

  // Global State Store with Persistent Storage
  window.PlotShareApp = {
    lang: localStorage.getItem('plotshare_lang') || 'bn',
    currentRoute: 'home',
    plots: JSON.parse(localStorage.getItem('plotshare_plots')) || INITIAL_PLOTS,
    farmData: JSON.parse(localStorage.getItem('plotshare_farm')) || CURRENT_FARM_DATA,
    savedFavorites: JSON.parse(localStorage.getItem('plotshare_favs')) || ['plot-101'],
    selectedPlot: null,
    locations: BANGLADESH_LOCATIONS,
    converter: AREA_CONVERTER,
    crops: CROPS,
    seasons: SEASONS,
    diseases: PLANT_DISEASES,
    machinery: AGRICULTURAL_MACHINERY,
    marketRates: WHOLESALE_MARKET_RATES,
    dict: DICTIONARY,
    leafletMap: null,
    chatMessages: [
      { sender: 'ai', text_bn: 'আসসালামু আলাইকুম! আমি প্লটশেয়ার এআই কৃষি সহায়ক। আপনার জমি, সার প্রয়োগ, ফসলের রোগ বা আবহাওয়া সংক্রান্ত যেকোনো প্রশ্ন করতে পারেন।', text_en: 'Greetings! I am the PlotShare AI Farm Assistant. Ask me anything about crop planning, fertilizer, pest control, or weather guidance!' }
    ]
  };

  // Language Toggle
  window.toggleLanguage = function() {
    window.PlotShareApp.lang = window.PlotShareApp.lang === 'bn' ? 'en' : 'bn';
    localStorage.setItem('plotshare_lang', window.PlotShareApp.lang);
    updateGlobalUI();
    renderCurrentRoute();
    showToast(window.PlotShareApp.lang === 'bn' ? 'ভাষা পরিবর্তন করা হয়েছে: বাংলা' : 'Language switched to English', 'info');
  };

  // Device Frame Toggle
  window.toggleDeviceView = function() {
    document.body.classList.toggle('fullscreen-mode');
    const isFull = document.body.classList.contains('fullscreen-mode');
    showToast(isFull ? (window.PlotShareApp.lang === 'bn' ? 'ফুলস্ক্রিন ভিউ মোড' : 'Fullscreen View Mode') : (window.PlotShareApp.lang === 'bn' ? 'মোবাইল ফ্রেম ভিউ মোড' : 'Mobile Frame Preview Mode'), 'info');
  };

  // Horizon UI Toast Function
  window.showToast = function(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    const colors = type === 'success' ? 'bg-success-leaf text-white' : type === 'info' ? 'bg-hz-navy text-white' : 'bg-primary text-white';
    toast.className = `${colors} px-4 py-3 rounded-hz shadow-hz-lg text-xs font-bold flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto border border-white/20`;
    toast.innerHTML = `<span class="material-symbols-outlined text-base">${type === 'success' ? 'check_circle' : 'info'}</span><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove('translate-y-[-10px]', 'opacity-0'); }, 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-[-10px]');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  };

  // Global UI Update
  function updateGlobalUI() {
    const lang = window.PlotShareApp.lang;
    const d = DICTIONARY[lang];
    document.documentElement.lang = lang;

    // Header labels
    document.getElementById('brand-title').textContent = d.app_name;
    document.getElementById('brand-subtitle').textContent = lang === 'bn' ? 'কৃষি জমি ও চাষাবাদ প্ল্যাটফর্ম' : 'Agricultural Land & Farm Platform';
    document.getElementById('lang-btn-label').textContent = d.switch_lang;

    // Bottom Navigation Labels
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (d[key]) el.textContent = d[key];
    });
  }

  // ROUTER
  function handleRoute() {
    const hash = window.location.hash.slice(1) || 'home';
    const parts = hash.split('/');
    const mainRoute = parts[0];
    const param = parts[1];

    window.PlotShareApp.currentRoute = mainRoute;
    if (mainRoute === 'plot-details' && param) {
      window.PlotShareApp.selectedPlot = window.PlotShareApp.plots.find(p => p.id === param) || window.PlotShareApp.plots[0];
    }

    // Update active nav tab
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const target = tab.getAttribute('data-target');
      if (target === mainRoute) {
        tab.classList.add('nav-tab-active');
      } else {
        tab.classList.remove('nav-tab-active');
      }
    });

    renderCurrentRoute();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', handleRoute);

  // RENDER ENGINE
  function renderCurrentRoute() {
    const container = document.getElementById('screen-container');
    const route = window.PlotShareApp.currentRoute;
    const lang = window.PlotShareApp.lang;
    const isBn = lang === 'bn';

    container.className = 'flex-1 w-full pb-24 overflow-x-hidden relative page-fade-in';

    switch (route) {
      case 'home':
        container.innerHTML = renderHomeScreen(isBn);
        break;
      case 'explore':
        container.innerHTML = renderExploreScreen(isBn);
        setTimeout(initLeafletMap, 50);
        break;
      case 'plot-details':
        container.innerHTML = renderPlotDetailsScreen(isBn);
        break;
      case 'book-plot':
        container.innerHTML = renderBookPlotScreen(isBn);
        setTimeout(initSignaturePad, 50);
        break;
      case 'list-plot':
        container.innerHTML = renderListPlotScreen(isBn);
        break;
      case 'my-farm':
        container.innerHTML = renderMyFarmScreen(isBn);
        break;
      case 'grow-assistant':
        container.innerHTML = renderGrowAssistantScreen(isBn);
        break;
      case 'disease-scanner':
        container.innerHTML = renderDiseaseScannerScreen(isBn);
        break;
      case 'farm-planner':
        container.innerHTML = renderFarmPlannerScreen(isBn);
        break;
      case 'crop-planner':
        container.innerHTML = renderCropPlannerScreen(isBn);
        break;
      case 'harvest-tracker':
        container.innerHTML = renderHarvestTrackerScreen(isBn);
        break;
      case 'machinery':
        container.innerHTML = renderMachineryScreen(isBn);
        break;
      case 'community':
        container.innerHTML = renderCommunityScreen(isBn);
        break;
      case 'marketplace':
        container.innerHTML = renderMarketplaceScreen(isBn);
        break;
      case 'notifications':
        container.innerHTML = renderNotificationsScreen(isBn);
        break;
      case 'profile':
        container.innerHTML = renderProfileScreen(isBn);
        break;
      default:
        container.innerHTML = renderHomeScreen(isBn);
        break;
    }

    attachScreenEventHandlers();
  }

  // 1. HOME SCREEN (HORIZON UI CARDS & METRICS)
  function renderHomeScreen(isBn) {
    const farm = window.PlotShareApp.farmData;
    const plots = window.PlotShareApp.plots;
    const activeCrop = farm.active_crops[0];
    const marketRates = window.PlotShareApp.marketRates;

    return `
      <div class="px-4 py-4 flex flex-col gap-5">
        
        <!-- Horizon UI Welcome Hero Card -->
        <div class="bg-hz-card p-5 rounded-hz-lg shadow-hz border border-hz-border">
          <div class="flex items-center justify-between mb-3">
            <div>
              <span class="text-[11px] font-bold text-hz-slate uppercase tracking-wider">${isBn ? 'স্বাগতম' : 'Welcome'}</span>
              <h2 class="text-xl font-extrabold text-hz-navy">${isBn ? farm.farmer_name_bn : farm.farmer_name_en} 👋</h2>
            </div>
            <div class="flex items-center gap-1 bg-success-light text-success-leaf px-3 py-1 rounded-hz-pill text-xs font-extrabold border border-success-mint/30">
              <span class="material-symbols-outlined text-[16px]">verified</span>
              <span>${isBn ? 'যাচাইকৃত কৃষক' : 'Verified Farmer'}</span>
            </div>
          </div>

          <!-- Horizon Pill Search Box -->
          <div class="relative mt-3">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-hz-slate">search</span>
            <input id="home-search-input" type="text" placeholder="${isBn ? 'জেলা, উপজেলা (দিনাজপুর, বগুড়া) বা ফসল লিখে খুঁজুন...' : 'Search by District, Upazila (Dinajpur, Bogura) or crop...'}" class="w-full bg-hz-input h-12 pl-11 pr-24 rounded-hz-pill border border-hz-border focus:outline-none focus:ring-2 focus:ring-primary text-xs font-semibold text-hz-navy">
            <button onclick="executeSearch()" class="absolute right-1.5 top-1/2 -translate-y-1/2 bg-primary text-white px-4 py-2 rounded-hz-pill text-xs font-bold flex items-center gap-1 shadow-sm hover:bg-primary-hover transition-colors">
              <span>${isBn ? 'খুঁজুন' : 'Search'}</span>
            </button>
          </div>

          <!-- Horizon District Filter Pills -->
          <div class="flex gap-2 mt-3.5 overflow-x-auto hide-scrollbar pb-1">
            <button onclick="quickFilterDistrict('dinajpur')" class="flex-shrink-0 px-3.5 py-1.5 bg-hz-input border border-hz-border rounded-hz-pill text-xs font-bold text-hz-navy hover:bg-primary hover:text-white transition-all shadow-sm">🌾 ${isBn ? 'দিনাজপুর' : 'Dinajpur'}</button>
            <button onclick="quickFilterDistrict('bogura')" class="flex-shrink-0 px-3.5 py-1.5 bg-hz-input border border-hz-border rounded-hz-pill text-xs font-bold text-hz-navy hover:bg-primary hover:text-white transition-all shadow-sm">🥔 ${isBn ? 'বগুড়া' : 'Bogura'}</button>
            <button onclick="quickFilterDistrict('chapainawabganj')" class="flex-shrink-0 px-3.5 py-1.5 bg-hz-input border border-hz-border rounded-hz-pill text-xs font-bold text-hz-navy hover:bg-primary hover:text-white transition-all shadow-sm">🥭 ${isBn ? 'চাঁপাইনবাবগঞ্জ' : 'Chapainawabganj'}</button>
            <button onclick="quickFilterDistrict('mymensingh')" class="flex-shrink-0 px-3.5 py-1.5 bg-hz-input border border-hz-border rounded-hz-pill text-xs font-bold text-hz-navy hover:bg-primary hover:text-white transition-all shadow-sm">🌱 ${isBn ? 'ময়মনসিংহ' : 'Mymensingh'}</button>
          </div>
        </div>

        <!-- Horizon UI 4-Grid Mini Stat Features -->
        <div class="grid grid-cols-2 gap-3">
          
          <a href="#disease-scanner" class="bg-hz-card p-4 rounded-hz shadow-hz border border-hz-border flex items-center gap-3.5 hover:border-primary transition-all">
            <div class="w-12 h-12 rounded-full bg-success-light text-success-leaf flex items-center justify-center font-bold shrink-0">
              <span class="material-symbols-outlined text-2xl">document_scanner</span>
            </div>

  // Initialize Leaflet Map
  function initLeafletMap() {
    const mapEl = document.getElementById('leaflet-map');
    if (!mapEl || typeof L === 'undefined') return;

    if (window.PlotShareApp.leafletMap) {
      window.PlotShareApp.leafletMap.remove();
    }

    const map = L.map('leaflet-map').setView([24.8, 89.2], 7);
    window.PlotShareApp.leafletMap = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const isBn = window.PlotShareApp.lang === 'bn';
    const plots = window.PlotShareApp.plots;

    plots.forEach(plot => {
      if (plot.lat && plot.lng) {
        const pinIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `🌾 ৳${isBn ? AREA_CONVERTER.toBanglaNum(plot.price_bdt.toLocaleString()) : plot.price_bdt.toLocaleString()}`,
          iconSize: [85, 26],
          iconAnchor: [42, 13]
        });

        const marker = L.marker([plot.lat, plot.lng], { icon: pinIcon }).addTo(map);
        marker.bindPopup(`
          <div class="text-xs p-1">
            <strong class="text-primary text-sm">${isBn ? plot.title_bn : plot.title_en}</strong><br>
            📍 ${isBn ? plot.location_label_bn : plot.location_label_en}<br>
            📐 ${isBn ? AREA_CONVERTER.toBanglaNum(plot.area_shotok) : plot.area_shotok} ${isBn ? 'শতক' : 'Shotok'}<br>
            <a href="#plot-details/${plot.id}" class="inline-block mt-2 px-3 py-1 bg-primary text-white rounded font-bold text-center">জমি দেখুন</a>
          </div>
        `);
      }
    });
  }

  // Initialize Signature Canvas
  function initSignaturePad() {
    const canvas = document.getElementById('signature-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#A43700';

    let drawing = false;

    function startDraw(e) {
      drawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      ctx.lineTo(clientX - rect.left, clientY - rect.top);
      ctx.stroke();
    }

    function stopDraw() {
      drawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    window.clearSignaturePad = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }

  // ACTION HANDLERS & MODAL SYSTEM (HORIZON UI MODALS)
  window.toggleFav = function(plotId) {
    const favs = window.PlotShareApp.savedFavorites;
    const idx = favs.indexOf(plotId);
    if (idx > -1) {
      favs.splice(idx, 1);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দের তালিকা থেকে সরানো হয়েছে' : 'Removed from favorites', 'info');
    } else {
      favs.push(plotId);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দের তালিকায় যুক্ত হয়েছে' : 'Added to favorites', 'success');
    }
    localStorage.setItem('plotshare_favs', JSON.stringify(favs));
    renderCurrentRoute();
  };

  window.executeSearch = function() {
    const input = document.getElementById('home-search-input');
    const q = input ? input.value.trim().toLowerCase() : '';
    if (q) {
      window.location.hash = '#explore';
      showToast(window.PlotShareApp.lang === 'bn' ? `"${q}" এর জন্য কৃষি জমি ফিল্টার করা হয়েছে` : `Filtered lands for "${q}"`, 'info');
    }
  };

  window.quickFilterDistrict = function(dist) {
    window.location.hash = '#explore';
    showToast(window.PlotShareApp.lang === 'bn' ? `দিনাজপুর ও সংশ্লিষ্ট জেলার জমি প্রদর্শিত হচ্ছে` : `Displaying lands in selected district`, 'info');
  };

  window.submitAgreementRequest = function() {
    showToast(window.PlotShareApp.lang === 'bn' ? 'স্বাক্ষরিত বর্গা চুক্তিপত্র সফলভাবে মালিকের কাছে পাঠানো হয়েছে!' : 'Signed agreement proposal submitted to landowner!', 'success');
    setTimeout(() => {
      window.location.hash = '#my-farm';
    }, 1200);
  };

  window.handlePlotPublish = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'আপনার কৃষি জমি সফলভাবে তালিকাভুক্ত হয়েছে!' : 'Your farmland has been published successfully!', 'success');
    setTimeout(() => {
      window.location.hash = '#explore';
    }, 1200);
  };

  window.toggleTask = function(taskId) {
    const task = window.PlotShareApp.farmData.tasks_today.find(t => t.id === taskId);
    if (task) {
      task.done = !task.done;
      localStorage.setItem('plotshare_farm', JSON.stringify(window.PlotShareApp.farmData));
      renderCurrentRoute();
      showToast(task.done ? (window.PlotShareApp.lang === 'bn' ? 'কাজটি সম্পন্ন চিহ্নিত হয়েছে' : 'Task marked complete') : (window.PlotShareApp.lang === 'bn' ? 'কাজটি আবার সক্রিয় করা হয়েছে' : 'Task reactivated'), 'success');
    }
  };

      window.location.hash = '#my-farm';
    }, 1200);
  };

  window.openAddExpenseModal = function(cropId) {
    const isBn = window.PlotShareApp.lang === 'bn';
    const modal = document.getElementById('modal-container');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="bg-hz-card p-6 rounded-hz-lg max-w-sm w-full shadow-hz-lg border border-hz-border flex flex-col gap-4">

          <h3 class="font-extrabold text-base text-hz-navy">${isBn ? 'খামারের খরচ যুক্ত করুন' : 'Log Farm Expense'}</h3>

          </div>
          <div>
            <label class="block font-bold text-hz-navy mb-1">${isBn ? 'টাকার পরিমাণ (৳):' : 'Amount (BDT):'}</label>

          <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-hz font-extrabold mt-2 shadow-primary-btn hover:bg-primary-hover transition-all">

          </button>

  };

  window.saveExpense = function(e, cropId) {
    e.preventDefault();
    const amount = parseInt(document.getElementById('exp-amount').value) || 0;
    const title = document.getElementById('exp-title').value;
    const cat = document.getElementById('exp-cat').value;

    const crop = window.PlotShareApp.farmData.active_crops.find(c => c.id === cropId) || window.PlotShareApp.farmData.active_crops[0];
    crop.expenses_bdt = (crop.expenses_bdt || 0) + amount;
    crop.expenses_log = crop.expenses_log || [];
    crop.expenses_log.push({ id: 'exp-' + Date.now(), category: cat, title: title, amount: amount, date: '2026-02-16' });

    localStorage.setItem('plotshare_farm', JSON.stringify(window.PlotShareApp.farmData));
    closeModal();
    renderCurrentRoute();
    showToast(window.PlotShareApp.lang === 'bn' ? `৳${amount} খরচ সফলভাবে সংরক্ষিত হয়েছে!` : `Expense of ৳${amount} logged!`, 'success');
  };

  window.openLogHarvestModal = function() {
    const isBn = window.PlotShareApp.lang === 'bn';
    const modal = document.getElementById('modal-container');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="bg-hz-card p-6 rounded-hz-lg max-w-sm w-full shadow-hz-lg border border-hz-border flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <h3 class="font-extrabold text-base text-hz-navy">${isBn ? 'উত্তোলিত ফসলের ফলন রেকর্ড করুন' : 'Log Harvested Crop'}</h3>

        <form onsubmit="saveHarvest(event)" class="flex flex-col gap-3 text-xs">

              <option>বোরো ধান (ব্রি-২৮)</option>
              <option>ডায়মন্ড আলু</option>

          <div class="grid grid-cols-2 gap-2">

            <div>
              <label class="block font-bold text-hz-navy mb-1">${isBn ? 'বিক্রয় দর (৳/মণ):' : 'Rate (BDT/Maund):'}</label>

        </form>
      </div>
    `;
  };

  window.saveHarvest = function(e) {
    e.preventDefault();
    closeModal();
    showToast(window.PlotShareApp.lang === 'bn' ? 'ফলন ও বিক্রির হিসাব সফলভাবে সংরক্ষিত হয়েছে!' : 'Harvest record saved successfully!', 'success');
  };

  window.closeModal = function() {
    const modal = document.getElementById('modal-container');
    if (modal) modal.classList.add('hidden');
  };

  window.askAIQuery = function(q) {
    const input = document.getElementById('ai-user-input');
    if (input) input.value = q;
    handleAIChatSubmit(new Event('submit'));
  };

  window.handleAIChatSubmit = function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const input = document.getElementById('ai-user-input');
    if (!input || !input.value.trim()) return;

    const userText = input.value.trim();
    input.value = '';

    window.PlotShareApp.chatMessages.push({ sender: 'user', text: userText });
    renderCurrentRoute();

    // AI Response Simulator
    setTimeout(() => {
      let respBn = 'আপনার প্রশ্নের জন্য ধন্যবাদ। মাটির আর্দ্রতা পরীক্ষা করে প্রতি শতকে ১.২ কেজি ইউরিয়া ও ০.৬ কেজি টিএসপি সার প্রয়োগের পরামর্শ দেওয়া হচ্ছে। অতিরিক্ত বৃষ্টির আগে সেচ বন্ধ রাখুন।';
      let respEn = 'Thank you for your question. Based on current soil conditions, recommend applying 1.2 kg Urea and 0.6 kg TSP per shotok. Hold off on heavy irrigation before expected rainfall.';

      if (userText.includes('পাতা হলুদ') || userText.includes('yellow')) {
        respBn = 'টমেটো বা ফসলের পাতা হলুদ হওয়ার প্রধান কারণ নাইট্রোজেনের ঘাটতি বা অতিরিক্ত জলাবদ্ধতা। ইউরিয়া ও জিংক স্প্রে করুন এবং পানি নিষ্কাশন নিশ্চিত করুন।';
        respEn = 'Yellowing leaves usually indicate Nitrogen deficiency or waterlogging. Apply light Urea solution and ensure proper drainage.';
      } else if (userText.includes('সার') || userText.includes('fertilizer')) {
        respBn = '৫০ শতক বোরো ধানের জন্য মোট ৬০ কেজি ইউরিয়া, ৩০ কেজি টিএসপি, ৩৫ কেজি এমওপি এবং ৫ কেজি জিংক সালফেট ৩ কিস্তিতে প্রয়োগ করুন।';
        respEn = 'For 50 Shotok Boro rice, use 60 kg Urea, 30 kg TSP, 35 kg MoP, and 5 kg Zinc Sulfate split across 3 phases.';
      }

      window.PlotShareApp.chatMessages.push({ sender: 'ai', text_bn: respBn, text_en: respEn });
      renderCurrentRoute();
      
      const box = document.getElementById('ai-chat-box');
      if (box) box.scrollTop = box.scrollHeight;
    }, 600);
  };

  window.generateFarmPlan = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'নতুন খামার পরিকল্পনা প্রস্তুত করা হয়েছে!' : 'Farm plan generated successfully!', 'success');
  };

  function attachScreenEventHandlers() {
    const box = document.getElementById('ai-chat-box');
    if (box) box.scrollTop = box.scrollHeight;
  }

  // INITIALIZE
  document.addEventListener('DOMContentLoaded', () => {
    updateGlobalUI();
    handleRoute();
  });
</script>
