<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlotShare — Bangladesh Agricultural Land & Farming Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#fdf9f4",
            "surface-container": "#f1ede8",
            "surface-container-high": "#ebe8e3",
            "surface-container-highest": "#e6e2dd",
            "surface-container-low": "#f7f3ee",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1c1c19",
            "on-surface-variant": "#5a4138",
            "primary": "#a43700",
            "on-primary": "#ffffff",
            "primary-container": "#cd4700",
            "on-primary-container": "#fffbff",
            "secondary": "#7e5700",
            "on-secondary": "#ffffff",
            "secondary-container": "#feb300",
            "on-secondary-container": "#6a4800",
            "tertiary": "#914723",
            "on-tertiary": "#ffffff",
            "tertiary-container": "#b05e38",
            "on-tertiary-container": "#fffbff",
            "outline": "#8f7066",
            "outline-variant": "#e3bfb2",
            "success-leaf": "#2D5A27",
            "golden-amber": "#FFB300",
            "harvest-orange": "#E65100",
            "terracotta": "#A0522D",
            "deep-earth": "#2C1B12",
            "rice-cream": "#F9F5F0"
          },
          fontFamily: {
            sans: ["'Hind Siliguri'", "'Hanken Grotesk'", "sans-serif"]
          },
          borderRadius: {
            "xl": "1rem",
            "2xl": "1.5rem",
            "3xl": "2rem"
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #fdf9f4;
      color: #1c1c19;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-family: 'Hind Siliguri', 'Hanken Grotesk', sans-serif;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Device Frame Toggle */
    .device-preview-wrapper {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(44, 27, 18, 0.12);
      position: relative;
      background: #fdf9f4;
    }
    .fullscreen-mode .device-preview-wrapper {
      max-width: 100%;
      box-shadow: none;
    }
    
    .nav-tab-active {
      color: #a43700 !important;
      font-weight: 700;
    }
    .nav-tab-active .tab-dot {
      display: block !important;
    }
    
    /* Subtle animations */
    .page-fade-in {
      animation: fadeIn 0.22s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Pulse badge */
    .pulse-dot {
      box-shadow: 0 0 0 0 rgba(45, 90, 39, 0.7);
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 90, 39, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(45, 90, 39, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 90, 39, 0); }
    }
  </style>
</head>
<body class="bg-surface-container-high/40 text-on-surface antialiased select-none">

<div class="device-preview-wrapper flex flex-col relative min-h-screen" id="app-root">

  <!-- TOP HEADER (Bilingual + Global Actions) -->
  <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-outline-variant/30 pt-safe px-4 py-3 flex items-center justify-between shadow-[0_1px_8px_rgba(0,0,0,0.03)]" id="global-header">
    <div class="flex items-center gap-2.5">
      <a href="#home" class="flex items-center gap-2" id="header-brand-link">
        <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white shadow-sm font-bold text-lg">🌾</div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-primary flex items-center gap-1.5">
            <span id="brand-title">প্লটশেয়ার</span>
            <span class="text-[10px] bg-secondary-container text-on-secondary-container px-1.5 py-0.5 rounded-full font-bold uppercase tracking-wider">BD</span>
          </h1>
          <p class="text-[11px] text-on-surface-variant leading-none" id="brand-subtitle">কৃষি জমি ও চাষাবাদ প্ল্যাটফর্ম</p>
        </div>
      </a>
    </div>

    <!-- Right Controls: Language Switcher + Notifications + View Mode -->
    <div class="flex items-center gap-2">
      <!-- Language Switcher Button -->
      <button id="btn-lang-toggle" onclick="toggleLanguage()" class="px-2.5 py-1 rounded-full bg-surface-container-highest text-primary font-bold text-xs border border-outline-variant/40 flex items-center gap-1 hover:bg-primary hover:text-white transition-all shadow-sm">
        <span class="material-symbols-outlined text-[15px]">language</span>
        <span id="lang-btn-label">English</span>
      </button>

      <!-- View Mode (Mobile Frame vs Wide) -->
      <button onclick="toggleDeviceView()" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" title="Toggle Layout View">
        <span class="material-symbols-outlined text-[18px]">devices</span>
      </button>

      <!-- Notifications -->
      <a href="#notifications" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant relative hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-primary ring-2 ring-surface"></span>
      </a>
    </div>
  </header>

  <!-- SCREEN VIEWPORT CONTAINER -->
  <main class="flex-1 w-full pb-24 overflow-x-hidden relative" id="screen-container">
    <!-- Dynamically loaded screen content will be injected here -->
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-xl border-t border-outline-variant/30 pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.06)]" id="global-bottom-nav">
    <div class="max-w-[440px] mx-auto flex items-center justify-around h-16 px-2 relative" id="bottom-nav-inner">
      
      <!-- 1. Home -->
      <a href="#home" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-on-surface-variant transition-all" data-target="home">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[11px] font-medium mt-0.5" data-i18n="home">হোম</span>
        <span class="tab-dot hidden w-1.5 h-1.5 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- 2. Explore Farmlands -->
      <a href="#explore" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-on-surface-variant transition-all" data-target="explore">
        <span class="material-symbols-outlined text-2xl">travel_explore</span>
        <span class="text-[11px] font-medium mt-0.5" data-i18n="explore">জমি খুঁজুন</span>
        <span class="tab-dot hidden w-1.5 h-1.5 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- Center Floating Action: List Land (+ জমি দিন) -->
      <div class="flex flex-col items-center justify-center -translate-y-4">
        <a href="#list-plot" class="w-13 h-13 p-3 rounded-full bg-primary text-white flex items-center justify-center shadow-lg shadow-primary/30 hover:scale-105 active:scale-95 transition-transform" title="List Farmland">
          <span class="material-symbols-outlined text-3xl font-bold">add_location_alt</span>
        </a>
        <span class="text-[11px] font-bold text-primary mt-1" data-i18n="list_plot">জমি দিন</span>
      </div>

      <!-- 3. My Farm -->
      <a href="#my-farm" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-on-surface-variant transition-all" data-target="my-farm">
        <span class="material-symbols-outlined text-2xl">agriculture</span>
        <span class="text-[11px] font-medium mt-0.5" data-i18n="my_farm">আমার খামার</span>
        <span class="tab-dot hidden w-1.5 h-1.5 bg-primary rounded-full mt-0.5"></span>
      </a>

      <!-- 4. AI Assistant -->
      <a href="#grow-assistant" class="nav-tab flex flex-col items-center justify-center w-14 h-full text-on-surface-variant transition-all" data-target="grow-assistant">
        <span class="material-symbols-outlined text-2xl text-secondary">psychology</span>
        <span class="text-[11px] font-medium mt-0.5" data-i18n="ai_assistant">কৃষি সহায়ক</span>
        <span class="tab-dot hidden w-1.5 h-1.5 bg-primary rounded-full mt-0.5"></span>
      </a>

    </div>
  </nav>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-[90%] max-w-[380px]"></div>

</div>

<!-- APPLICATION CORE SCRIPTS -->
<script type="module">
  import { BANGLADESH_LOCATIONS, AREA_CONVERTER, SEASONS, CROPS, INITIAL_PLOTS, CURRENT_FARM_DATA, DICTIONARY } from './src/data/bangladeshData.js';

  // Global State Store
  window.PlotShareApp = {
    lang: localStorage.getItem('plotshare_lang') || 'bn',
    currentRoute: 'home',
    plots: JSON.parse(localStorage.getItem('plotshare_plots')) || INITIAL_PLOTS,
    farmData: JSON.parse(localStorage.getItem('plotshare_farm')) || CURRENT_FARM_DATA,
    savedFavorites: JSON.parse(localStorage.getItem('plotshare_favs')) || ['plot-101'],
    selectedPlot: null,
    locations: BANGLADESH_LOCATIONS,
    converter: AREA_CONVERTER,
    crops: CROPS,
    seasons: SEASONS,
    dict: DICTIONARY,
    chatMessages: [
      { sender: 'ai', text_bn: 'আসসালামু আলাইকুম! আমি প্লটশেয়ার এআই কৃষি সহায়ক। আপনার জমি, সার প্রয়োগ, ফসলের রোগ বা আবহাওয়া সংক্রান্ত যেকোনো প্রশ্ন করতে পারেন।', text_en: 'Greetings! I am the PlotShare AI Farm Assistant. Ask me anything about crop planning, fertilizer, pest control, or weather guidance!' }
    ]
  };

  // Language Toggle
  window.toggleLanguage = function() {
    window.PlotShareApp.lang = window.PlotShareApp.lang === 'bn' ? 'en' : 'bn';
    localStorage.setItem('plotshare_lang', window.PlotShareApp.lang);
    updateGlobalUI();
    renderCurrentRoute();
    showToast(window.PlotShareApp.lang === 'bn' ? 'ভাষা পরিবর্তন করা হয়েছে: বাংলা' : 'Language switched to English', 'info');
  };

  // Device Frame Toggle
  window.toggleDeviceView = function() {
    document.body.classList.toggle('fullscreen-mode');
    const isFull = document.body.classList.contains('fullscreen-mode');
    showToast(isFull ? (window.PlotShareApp.lang === 'bn' ? 'ফুলস্ক্রিন ভিউ মোড' : 'Fullscreen View Mode') : (window.PlotShareApp.lang === 'bn' ? 'মোবাইল ফ্রেম ভিউ মোড' : 'Mobile Frame Preview Mode'), 'info');
  };

  // Toast Function
  window.showToast = function(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    const colors = type === 'success' ? 'bg-success-leaf text-white' : type === 'info' ? 'bg-secondary text-white' : 'bg-primary text-white';
    toast.className = `${colors} px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto`;
    toast.innerHTML = `<span class="material-symbols-outlined text-lg">${type === 'success' ? 'check_circle' : 'info'}</span><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove('translate-y-[-10px]', 'opacity-0'); }, 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-[-10px]');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  };

  // Global UI Update
  function updateGlobalUI() {
    const lang = window.PlotShareApp.lang;
    const d = DICTIONARY[lang];
    document.documentElement.lang = lang;

    // Header labels
    document.getElementById('brand-title').textContent = d.app_name;
    document.getElementById('brand-subtitle').textContent = lang === 'bn' ? 'কৃষি জমি ও চাষাবাদ প্ল্যাটফর্ম' : 'Agricultural Land & Farm Platform';
    document.getElementById('lang-btn-label').textContent = d.switch_lang;

    // Bottom Navigation Labels
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (d[key]) el.textContent = d[key];
    });
  }

  // ROUTER
  function handleRoute() {
    const hash = window.location.hash.slice(1) || 'home';
    const parts = hash.split('/');
    const mainRoute = parts[0];
    const param = parts[1];

    window.PlotShareApp.currentRoute = mainRoute;
    if (mainRoute === 'plot-details' && param) {
      window.PlotShareApp.selectedPlot = window.PlotShareApp.plots.find(p => p.id === param) || window.PlotShareApp.plots[0];
    }

    // Update active nav tab
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const target = tab.getAttribute('data-target');
      if (target === mainRoute) {
        tab.classList.add('nav-tab-active');
      } else {
        tab.classList.remove('nav-tab-active');
      }
    });

    renderCurrentRoute();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', handleRoute);

  // RENDER ENGINE
  function renderCurrentRoute() {
    const container = document.getElementById('screen-container');
    const route = window.PlotShareApp.currentRoute;
    const lang = window.PlotShareApp.lang;
    const isBn = lang === 'bn';

    container.className = 'flex-1 w-full pb-24 overflow-x-hidden relative page-fade-in';

    switch (route) {
      case 'splash':
        container.innerHTML = renderSplashScreen(isBn);
        break;
      case 'home':
        container.innerHTML = renderHomeScreen(isBn);
        break;
      case 'explore':
        container.innerHTML = renderExploreScreen(isBn);
        break;
      case 'plot-details':
        container.innerHTML = renderPlotDetailsScreen(isBn);
        break;
      case 'book-plot':
        container.innerHTML = renderBookPlotScreen(isBn);
        break;
      case 'list-plot':
        container.innerHTML = renderListPlotScreen(isBn);
        break;
      case 'my-farm':
        container.innerHTML = renderMyFarmScreen(isBn);
        break;
      case 'grow-assistant':
        container.innerHTML = renderGrowAssistantScreen(isBn);
        break;
      case 'farm-planner':
        container.innerHTML = renderFarmPlannerScreen(isBn);
        break;
      case 'crop-planner':
        container.innerHTML = renderCropPlannerScreen(isBn);
        break;
      case 'harvest-tracker':
        container.innerHTML = renderHarvestTrackerScreen(isBn);
        break;
      case 'community':
        container.innerHTML = renderCommunityScreen(isBn);
        break;
      case 'marketplace':
        container.innerHTML = renderMarketplaceScreen(isBn);
        break;
      case 'notifications':
        container.innerHTML = renderNotificationsScreen(isBn);
        break;
      case 'profile':
        container.innerHTML = renderProfileScreen(isBn);
        break;
      default:
        container.innerHTML = renderHomeScreen(isBn);
        break;
    }

    attachScreenEventHandlers();
  }

  // 1. HOME SCREEN
  function renderHomeScreen(isBn) {
    const farm = window.PlotShareApp.farmData;
    const plots = window.PlotShareApp.plots;
    const activeCrop = farm.active_crops[0];

    return `
      <div class="px-4 py-4 flex flex-col gap-5">
        
        <!-- Welcome Hero & Location Search -->
        <div class="bg-gradient-to-br from-surface-container-high via-surface-container to-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/40">
          <div class="flex items-center justify-between mb-3">
            <div>
              <span class="text-xs font-semibold text-primary uppercase tracking-wider">${isBn ? 'স্বাগতম' : 'Welcome'}</span>
              <h2 class="text-xl font-bold text-on-surface">${isBn ? farm.farmer_name_bn : farm.farmer_name_en} 👋</h2>
            </div>
            <div class="flex items-center gap-1 bg-success-leaf/10 text-success-leaf px-2.5 py-1 rounded-full text-xs font-bold">
              <span class="material-symbols-outlined text-[15px]">verified</span>
              <span>${isBn ? 'যাচাইকৃত কৃষক' : 'Verified Farmer'}</span>
            </div>
          </div>

          <!-- District / Upazila Search Box -->
          <div class="relative mt-2">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline">search</span>
            <input id="home-search-input" type="text" placeholder="${isBn ? 'জেলা, উপজেলা (যেমন: দিনাজপুর, বগুড়া) বা ফসল লিখে খুঁজুন...' : 'Search by District, Upazila (e.g. Dinajpur, Bogura) or crop...'}" class="w-full bg-surface-container-lowest h-12 pl-11 pr-24 rounded-xl border border-outline-variant/50 focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-inner">
            <button onclick="executeSearch()" class="absolute right-1.5 top-1/2 -translate-y-1/2 bg-primary text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm">
              <span class="material-symbols-outlined text-sm">filter_alt</span>
              <span>${isBn ? 'খুঁজুন' : 'Search'}</span>
            </button>
          </div>

          <!-- Quick District Chips -->
          <div class="flex gap-2 mt-3 overflow-x-auto hide-scrollbar pb-1">
            <button onclick="quickFilterDistrict('dinajpur')" class="flex-shrink-0 px-3 py-1 bg-surface-container-highest rounded-full text-xs font-medium hover:bg-primary hover:text-white transition-colors">🌾 ${isBn ? 'দিনাজপুর' : 'Dinajpur'}</button>
            <button onclick="quickFilterDistrict('bogura')" class="flex-shrink-0 px-3 py-1 bg-surface-container-highest rounded-full text-xs font-medium hover:bg-primary hover:text-white transition-colors">🥔 ${isBn ? 'বগুড়া' : 'Bogura'}</button>
            <button onclick="quickFilterDistrict('chapainawabganj')" class="flex-shrink-0 px-3 py-1 bg-surface-container-highest rounded-full text-xs font-medium hover:bg-primary hover:text-white transition-colors">🥭 ${isBn ? 'চাঁপাইনবাবগঞ্জ' : 'Chapainawabganj'}</button>
            <button onclick="quickFilterDistrict('mymensingh')" class="flex-shrink-0 px-3 py-1 bg-surface-container-highest rounded-full text-xs font-medium hover:bg-primary hover:text-white transition-colors">🌱 ${isBn ? 'ময়মনসিংহ' : 'Mymensingh'}</button>
          </div>
        </div>

        <!-- Weather & Irrigation AI Advisory Alert -->
        <div class="bg-secondary-container/20 border border-secondary/30 rounded-2xl p-4 relative overflow-hidden shadow-sm">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-secondary flex items-center justify-center text-white shrink-0 shadow-md">
              <span class="material-symbols-outlined text-xl">cloudy_snowing</span>
            </div>
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-sm text-on-secondary-container flex items-center gap-1.5">
                  <span>${isBn ? 'আবহাওয়া ও সেচ বার্তা (দিনাজপুর)' : 'Weather & Irrigation Alert (Dinajpur)'}</span>
                </h3>
                <span class="text-[11px] font-bold text-secondary bg-secondary/15 px-2 py-0.5 rounded-full">২৬°C • ৬৫% আর্দ্রতা</span>
              </div>
              <p class="text-xs text-on-surface-variant mt-1.5 leading-relaxed">
                <strong>${isBn ? 'জরুরি পরামর্শ:' : 'AI Advisory:'}</strong> ${isBn ? 'আগামীকাল বিকেলে দিনাজপুরে হালকা থেকে মাঝারি বৃষ্টির সম্ভাবনা রয়েছে। অতএব বোরো ধানের জমিতে আজকের বাড়তি সেচ স্থগিত রাখুন এবং বৃষ্টির পানি ধরে রাখতে আইল মেরামত করুন।' : 'Moderate rain expected tomorrow afternoon in Dinajpur. Please suspend extra irrigation for your Boro rice field and prepare boundary bunds to conserve rainwater.'}
              </p>
              <div class="mt-2.5 flex items-center gap-3">
                <a href="#grow-assistant" class="inline-flex items-center gap-1 text-xs font-bold text-primary hover:underline">
                  <span>${isBn ? 'এআই সহায়ককে আরও জিজ্ঞাসা করুন' : 'Ask AI Assistant'}</span>
                  <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- My Active Crop Progress (আমার খামার) -->
        <div class="bg-surface-container-lowest p-4 rounded-2xl border border-outline-variant/40 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-xl">psychiatry</span>

        <div class="bg-surface-container-lowest p-4 rounded-2xl border border-outline-variant/40 shadow-sm flex items-center gap-4">

  // ACTION HANDLERS
  window.toggleFav = function(plotId) {
    const favs = window.PlotShareApp.savedFavorites;
    const idx = favs.indexOf(plotId);
    if (idx > -1) {
      favs.splice(idx, 1);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দের তালিকা থেকে সরানো হয়েছে' : 'Removed from favorites', 'info');
    } else {
      favs.push(plotId);
      showToast(window.PlotShareApp.lang === 'bn' ? 'পছন্দের তালিকায় যুক্ত হয়েছে' : 'Added to favorites', 'success');
    }
    localStorage.setItem('plotshare_favs', JSON.stringify(favs));
    renderCurrentRoute();
  };

  window.executeSearch = function() {
    const input = document.getElementById('home-search-input');
    const q = input ? input.value.trim().toLowerCase() : '';
    if (q) {
      window.location.hash = '#explore';
      showToast(window.PlotShareApp.lang === 'bn' ? `"${q}" এর জন্য কৃষি জমি ফিল্টার করা হয়েছে` : `Filtered lands for "${q}"`, 'info');
    }
  };

  window.quickFilterDistrict = function(dist) {
    window.location.hash = '#explore';
    showToast(window.PlotShareApp.lang === 'bn' ? `দিনাজপুর ও সংশ্লিষ্ট জেলার জমি প্রদর্শিত হচ্ছে` : `Displaying lands in selected district`, 'info');
  };

  window.submitAgreementRequest = function() {
    showToast(window.PlotShareApp.lang === 'bn' ? 'বর্গা ও লিজের আবেদন সফলভাবে মালিকের কাছে পাঠানো হয়েছে!' : 'Agreement request successfully submitted to landowner!', 'success');
    setTimeout(() => {
      window.location.hash = '#my-farm';
    }, 1200);
  };

  window.handlePlotPublish = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'আপনার কৃষি জমি সফলভাবে তালিকাভুক্ত হয়েছে!' : 'Your farmland has been published successfully!', 'success');
    setTimeout(() => {
      window.location.hash = '#explore';
    }, 1200);
  };

  window.toggleTask = function(taskId) {
    const task = window.PlotShareApp.farmData.tasks_today.find(t => t.id === taskId);
    if (task) {
      task.done = !task.done;
      localStorage.setItem('plotshare_farm', JSON.stringify(window.PlotShareApp.farmData));
      renderCurrentRoute();
      showToast(task.done ? (window.PlotShareApp.lang === 'bn' ? 'কাজটি সম্পন্ন চিহ্নিত হয়েছে' : 'Task marked complete') : (window.PlotShareApp.lang === 'bn' ? 'কাজটি আবার সক্রিয় করা হয়েছে' : 'Task reactivated'), 'success');
    }
  };

  window.askAIQuery = function(q) {
    const input = document.getElementById('ai-user-input');
    if (input) input.value = q;
    handleAIChatSubmit(new Event('submit'));
  };

  window.handleAIChatSubmit = function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const input = document.getElementById('ai-user-input');
    if (!input || !input.value.trim()) return;

    const userText = input.value.trim();
    input.value = '';

    window.PlotShareApp.chatMessages.push({ sender: 'user', text: userText });
    renderCurrentRoute();

    // AI Response Simulator
    setTimeout(() => {
      let respBn = 'আপনার প্রশ্নের জন্য ধন্যবাদ। মাটির আর্দ্রতা পরীক্ষা করে প্রতি শতকে ১.২ কেজি ইউরিয়া ও ০.৬ কেজি টিএসপি সার প্রয়োগের পরামর্শ দেওয়া হচ্ছে। অতিরিক্ত বৃষ্টির আগে সেচ বন্ধ রাখুন।';
      let respEn = 'Thank you for your question. Based on current soil conditions, recommend applying 1.2 kg Urea and 0.6 kg TSP per shotok. Hold off on heavy irrigation before expected rainfall.';

      if (userText.includes('পাতা হলুদ') || userText.includes('yellow')) {
        respBn = 'টমেটো বা ফসলের পাতা হলুদ হওয়ার প্রধান কারণ নাইট্রোজেনের ঘাটতি বা অতিরিক্ত জলাবদ্ধতা। ইউরিয়া ও জিংক স্প্রে করুন এবং পানি নিষ্কাশন নিশ্চিত করুন।';
        respEn = 'Yellowing leaves usually indicate Nitrogen deficiency or waterlogging. Apply light Urea solution and ensure proper drainage.';
      } else if (userText.includes('সার') || userText.includes('fertilizer')) {
        respBn = '৫০ শতক বোরো ধানের জন্য মোট ৬০ কেজি ইউরিয়া, ৩০ কেজি টিএসপি, ৩৫ কেজি এমওপি এবং ৫ কেজি জিংক সালফেট ৩ কিস্তিতে প্রয়োগ করুন।';
        respEn = 'For 50 Shotok Boro rice, use 60 kg Urea, 30 kg TSP, 35 kg MoP, and 5 kg Zinc Sulfate split across 3 phases.';
      }

      window.PlotShareApp.chatMessages.push({ sender: 'ai', text_bn: respBn, text_en: respEn });
      renderCurrentRoute();
      
      const box = document.getElementById('ai-chat-box');
      if (box) box.scrollTop = box.scrollHeight;
    }, 600);
  };

  window.generateFarmPlan = function(e) {
    e.preventDefault();
    showToast(window.PlotShareApp.lang === 'bn' ? 'নতুন খামার পরিকল্পনা প্রস্তুত করা হয়েছে!' : 'Farm plan generated successfully!', 'success');
  };

  window.openAddExpenseModal = function() {
    showToast(window.PlotShareApp.lang === 'bn' ? 'খরচের ভাউচার যোগ করার উইন্ডো চালু হচ্ছে...' : 'Opening expense voucher logger...', 'info');
  };

  window.openLogHarvestModal = function() {
    showToast(window.PlotShareApp.lang === 'bn' ? 'ফলন উত্তোলনের তথ্য যুক্ত করার ফর্ম খোলা হচ্ছে...' : 'Opening harvest logging form...', 'info');
  };

  function attachScreenEventHandlers() {
    // Scroll AI chat to bottom if open
    const box = document.getElementById('ai-chat-box');
    if (box) box.scrollTop = box.scrollHeight;
  }

  // INITIALIZE
  document.addEventListener('DOMContentLoaded', () => {
    updateGlobalUI();
    handleRoute();
  });
</script>
